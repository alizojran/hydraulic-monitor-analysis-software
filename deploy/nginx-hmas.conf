# HMAS — nginx site config for Raspberry Pi (or any Linux host)
#
# Install:
#   sudo cp deploy/nginx-hmas.conf /etc/nginx/sites-available/hmas
#   sudo ln -sf /etc/nginx/sites-available/hmas /etc/nginx/sites-enabled/hmas
#   sudo nginx -t && sudo systemctl reload nginx
#
# Web root must contain the built SPA (see deploy/README.md):
#   v2/dist/  →  /var/www/hmas/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hmas;
    index index.html;

    # gzip the text assets nginx serves
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: any unknown path returns index.html so client-side
    # view switching survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached, or clients pin an old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: HTTPS over self-signed cert.
# WebSerial (navigator.serial) only works on a "secure context": HTTPS or
# localhost. If you access the Pi over the LAN by IP and need WebSerial, enable
# the block below. For a kiosk pointing at http://localhost/ you do NOT need it.
#
# Generate a cert first (valid 10 years, adjust CN to the Pi's hostname/IP):
#   sudo mkdir -p /etc/nginx/certs
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/nginx/certs/hmas.key -out /etc/nginx/certs/hmas.crt \
#     -subj "/CN=hmas.local"
